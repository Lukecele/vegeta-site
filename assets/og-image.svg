<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogBg" cx="30%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="auraGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Scouter Tech Grid Gridlines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Electric Ki Sparks in Background -->
  <path d="M 850 120 L 890 200 L 860 210 L 920 320" stroke="#38bdf8" stroke-width="5" fill="none" opacity="0.6" filter="url(#auraGlow)"/>
  <path d="M 1050 350 L 1020 420 L 1040 430 L 1000 520" stroke="#facc15" stroke-width="4" fill="none" opacity="0.5" filter="url(#auraGlow)"/>

  <!-- Left Side: Scouter Targeting Bracket & Typography -->
  <g transform="translate(80, 80)">
    <!-- Scouter Badge -->
    <rect x="0" y="0" width="310" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Courier New', monospace" font-size="14" fill="#38bdf8" font-weight="bold" letter-spacing="2">
      ⚡ SCOUTER // BATTLE POWER: 999,999+
    </text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="'Cinzel', serif, Georgia" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="1">
      VEGETA
    </text>
    <text x="0" y="160" font-family="'Cinzel', serif, Georgia" font-size="36" font-weight="700" fill="url(#goldText)" letter-spacing="3">
      IL PRINCIPE DEI SAIYAN
    </text>

    <!-- Subtitle / Headline -->
    <text x="0" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
      «IL MIO ORGOGLIO MI IMPEDISCE
    </text>
    <text x="0" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#goldText)" filter="url(#auraGlow)">
      DI ESEGUIRE I TUOI ORDINI!»
    </text>

    <!-- Description -->
    <text x="0" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">
      La parabola del guerriero indomabile: disciplina, camera gravitazionale a 450G,
    </text>
    <text x="0" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">
      il sacrificio di Majin Bu e la scalata per superare ogni limite.
    </text>

    <!-- Bottom Metadata -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#0369a1"/>
      <text x="18" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">PWA READY</text>
      <text x="160" y="21" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0" font-weight="600">
        Curato da @Lukecele • Con Scene HD e Doppiaggio Storico ITA
      </text>
    </g>
  </g>

  <!-- Right Side: Big Royal Saiyan Crest -->
  <g transform="translate(850, 160) scale(0.65)" filter="url(#auraGlow)">
    <circle cx="256" cy="256" r="240" fill="#0f172a" stroke="url(#goldText)" stroke-width="10"/>
    <path d="M 256 100 C 320 100 370 140 370 210 C 370 310 290 380 256 415 C 222 380 142 310 142 210 C 142 140 192 100 256 100 Z"
          fill="#dc2626" stroke="url(#goldText)" stroke-width="7"/>
    <path d="M 142 210 C 110 190 70 210 65 260 C 60 300 90 340 140 330 C 120 310 120 280 135 250 Z" 
          fill="url(#goldText)" stroke="#b45309" stroke-width="3"/>
    <path d="M 370 210 C 402 190 442 210 447 260 C 452 300 422 340 372 330 C 392 310 392 280 377 250 Z" 
          fill="url(#goldText)" stroke="#b45309" stroke-width="3"/>
    <path d="M 256 145 L 272 215 L 305 175 L 285 255 L 325 250 L 275 315 L 282 345 L 256 325 L 230 345 L 237 315 L 187 250 L 227 255 L 207 175 L 240 215 Z"
          fill="url(#goldText)" stroke="#78350f" stroke-width="3"/>
    <path d="M 234 82 L 243 96 L 256 86 L 269 96 L 278 82 L 285 106 L 274 106 L 267 96 L 256 103 L 245 96 L 238 106 L 227 106 Z" 
          fill="url(#goldText)" stroke="#b45309" stroke-width="2"/>
  </g>
</svg>
