<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>

    <!-- Super Saiyan Gold Gradient -->
    <linearGradient id="saiyanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Royal Crimson Gradient -->
    <linearGradient id="royalCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Electric Cyan Ki Glow -->
    <linearGradient id="electricKi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="kiAuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circular Plate -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" stroke="url(#saiyanGold)" stroke-width="8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 6"/>

  <!-- Energy Aura Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#electricKi)" stroke-width="3" opacity="0.4" filter="url(#kiAuraGlow)"/>

  <!-- Lightning Energy Sparks -->
  <path d="M 120 180 L 140 210 L 125 215 L 155 255" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#sparkGlow)" opacity="0.8"/>
  <path d="M 392 180 L 372 210 L 387 215 L 357 255" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#sparkGlow)" opacity="0.8"/>
  <path d="M 190 410 L 210 380 L 195 375 L 225 335" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round" filter="url(#sparkGlow)" opacity="0.7"/>

  <!-- The Royal Saiyan Crest (Emblem of King Vegeta and the Saiyan Royal Family) -->
  <g id="royalCrest" filter="url(#kiAuraGlow)">
    <!-- Central Shield Body (Crimson Background) -->
    <path d="M 256 100 
             C 320 100 370 140 370 210
             C 370 310 290 380 256 415
             C 222 380 142 310 142 210
             C 142 140 192 100 256 100 Z"
          fill="url(#royalCrimson)" 
          stroke="url(#saiyanGold)" 
          stroke-width="7"/>

    <!-- Inner Crest Gold Trim -->
    <path d="M 256 122
             C 305 122 346 154 346 210
             C 346 290 282 350 256 382
             C 230 350 166 290 166 210
             C 166 154 207 122 256 122 Z"
          fill="none" 
          stroke="url(#saiyanGold)" 
          stroke-width="3" 
          opacity="0.85"/>

    <!-- Royal Wing Flanges (Left & Right Wings) -->
    <path d="M 142 210 C 110 190 70 210 65 260 C 60 300 90 340 140 330 C 120 310 120 280 135 250 Z" 
          fill="url(#saiyanGold)" stroke="#b45309" stroke-width="3"/>
    <path d="M 370 210 C 402 190 442 210 447 260 C 452 300 422 340 372 330 C 392 310 392 280 377 250 Z" 
          fill="url(#saiyanGold)" stroke="#b45309" stroke-width="3"/>

    <!-- Iconic Central Saiyan Symbol: Stylized Flame / Trident of Royalty -->
    <path d="M 256 145
             L 272 215
             L 305 175
             L 285 255
             L 325 250
             L 275 315
             L 282 345
             L 256 325
             L 230 345
             L 237 315
             L 187 250
             L 227 255
             L 207 175
             L 240 215 Z"
          fill="url(#saiyanGold)"
          stroke="#78350f"
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- Central Royal Core (Inner Flame) -->
    <path d="M 256 195
             L 266 245
             L 280 240
             L 256 285
             L 232 240
             L 246 245 Z"
          fill="#ffffff"
          opacity="0.95"/>
  </g>

  <!-- Majin Crest Accent (Subtle Iconic 'M' at Crest Apex) -->
  <path d="M 234 82 L 243 96 L 256 86 L 269 96 L 278 82 L 285 106 L 274 106 L 267 96 L 256 103 L 245 96 L 238 106 L 227 106 Z" 
        fill="url(#saiyanGold)" stroke="#b45309" stroke-width="1.5"/>

  <!-- Scouter Reticle Targeting Marks (Top-Right HUD) -->
  <g stroke="#00f0ff" stroke-width="2" opacity="0.75" fill="none">
    <path d="M 380 90 L 420 90 L 420 130"/>
    <circle cx="410" cy="100" r="3" fill="#00f0ff"/>
    <text x="360" y="75" font-family="'Courier New', monospace" font-size="14" fill="#00f0ff" font-weight="bold">TARGET: SAIYAN</text>
  </g>
</svg>
